<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forja de Documentos - EAJ UNAERP</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --unaerp-blue: #4054a5;
            --unaerp-green: #8dc63f;
            --bg-color: #f4f6f9;
            --text-main: #333;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-main);
            transition: background-color 0.8s ease, color 0.8s ease;
        }
        
        body.dark-mode {
            background-color: #0b0c10;
        }
        body.dark-mode .container {
            background-color: #1f2833;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: #c5c6c7;
        }
        body.dark-mode label {
            color: #c5c6c7;
        }
        body.dark-mode h2, body.dark-mode .header-text {
            color: #66fcf1;
        }
        body.dark-mode .padawan-greeting {
            background: #111;
            color: #45a29e;
            border-left-color: #45a29e;
        }
        body.dark-mode input[type="text"], body.dark-mode select {
            background-color: #0b0c10;
            color: #fff;
            border-color: #45a29e;
        }
        body.dark-mode .header-img {
            background-color: white; 
            padding: 10px;
            border-radius: 8px;
        }

        .container { 
            max-width: 750px; 
            margin: 20px auto; 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            transition: background-color 0.8s ease, color 0.8s ease;
        }
        
        .header-img {
            width: 100%;
            max-width: 250px;
            display: block;
            margin: 0 auto 15px auto;
            object-fit: contain;
            transition: background-color 0.8s ease;
        }
        .header-text {
            text-align: center;
            color: var(--unaerp-blue);
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 25px;
            border-bottom: 3px solid var(--unaerp-green);
            padding-bottom: 20px;
            transition: color 0.8s ease;
        }
        
        h2 { 
            color: var(--text-main); 
            text-align: center; 
            margin-bottom: 5px;
            font-size: 1.2em;
            font-weight: 600;
            transition: color 0.8s ease;
        }
        
        .padawan-greeting {
            text-align: center;
            background: #eef2fa;
            color: var(--unaerp-blue);
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 600;
            margin-bottom: 30px;
            border-left: 4px solid var(--unaerp-blue);
            cursor: crosshair; 
            transition: all 0.3s ease;
        }
        .padawan-greeting:hover {
            transform: scale(1.02);
        }
        
        .campo { margin-bottom: 20px; }
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: #444; 
            font-size: 0.95em;
            transition: color 0.8s ease;
        }
        input[type="text"], select { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1.5px solid #d1d5db; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            background-color: white;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, select:focus {
            border-color: var(--unaerp-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(64, 84, 165, 0.15);
        }
        
        .checkbox-group { 
            display: flex; 
            gap: 15px; 
            margin: 25px 0; 
            background: #f8f9fa; 
            padding: 20px; 
            border-radius: 8px; 
            flex-wrap: wrap; 
            justify-content: center;
            border: 1px solid #e5e7eb;
            transition: background-color 0.8s ease;
        }
        body.dark-mode .checkbox-group {
            background-color: #111;
            border-color: #45a29e;
        }
        
        .checkbox-item { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            color: var(--unaerp-blue);
            transition: color 0.8s ease;
        }
        body.dark-mode .checkbox-item {
            color: #66fcf1;
        }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--unaerp-blue);
        }
        
        button { 
            background: linear-gradient(135deg, var(--unaerp-blue), #2c3e80); 
            color: white; 
            border: none; 
            padding: 16px; 
            font-size: 17px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 15px; 
            font-weight: 700; 
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(64, 84, 165, 0.3);
        }
        button:disabled { 
            background: #9ca3af; 
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }
        
        button.sith-mode {
            background: linear-gradient(135deg, #e50914, #8b0000);
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.6);
        }
        button.sith-mode:hover {
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.9);
        }

        .idle-toast {
            position: fixed;
            bottom: -100px;
            right: 20px;
            background: linear-gradient(135deg, var(--unaerp-blue), #2c3e80);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: bottom 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            cursor: pointer;
        }
        .idle-toast.show {
            bottom: 30px;
            animation: pulse-toast 2s infinite 1s;
        }
        body.dark-mode .idle-toast {
            background: linear-gradient(135deg, #111, #1f2833);
            color: #45a29e;
            border: 1px solid #45a29e;
            box-shadow: 0 0 15px rgba(69, 162, 158, 0.4);
        }
        @keyframes pulse-toast {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <img src="modelos/cabecalho.png" alt="Logo UNAERP" class="header-img">
    <div class="header-text">Escritório de Assistência Jurídica</div>
    
    <h2>Forja de Documentos do EAJ</h2>
    
    <div class="padawan-greeting" ondblclick="revelarSegredo()" title="Sente alguma perturbação na Força? Dê um duplo clique.">
        Saudações, Bruna, Chueng Lee, Philip e Pedro... Petições forjar, vocês devem!<br>
        <em>Que a Força esteja com vocês, jovens padawans.</em>
    </div>
    
    <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" id="chk_habilitacao" checked> Habilitação</label>
        <label class="checkbox-item"><input type="checkbox" id="chk_contestacao"> Contestação por negativa geral</label>
        <label class="checkbox-item"><input type="checkbox" id="chk_procuracao" checked> Procuração</label>
        <label class="checkbox-item"><input type="checkbox" id="chk_gratuidade" checked> Gratuidade</label>
    </div>

    <div class="campo">
        <label>Vara (ex: 1ª):</label>
        <input type="text" id="vara" placeholder="1ª" onkeyup="verificarOrdem66()">
    </div>
    
    <div class="campo">
        <label>Competência / Especialidade:</label>
        <select id="competencia">
            <option value="CÍVEL">CÍVEL</option>
            <option value="DE FAMÍLIA E SUCESSÕES">DE FAMÍLIA E SUCESSÕES</option>
            <option value="DA FAZENDA PÚBLICA">DA FAZENDA PÚBLICA</option>
            <option value="DA INFÂNCIA E DA JUVENTUDE E DO IDOSO">DA INFÂNCIA E DA JUVENTUDE E DO IDOSO</option>
        </select>
    </div>

    <div class="campo">
        <label>Processo nº:</label>
        <input type="text" id="numero" placeholder="0000000-00.0000.0.00.0000">
    </div>
    <div class="campo">
        <label>Nome Completo do Assistido:</label>
        <input type="text" id="nome_autor" placeholder="João da Silva">
    </div>
    <div class="campo">
        <label>Nacionalidade:</label>
        <input type="text" id="nacionalidade" value="brasileiro(a)">
    </div>
    <div class="campo">
        <label>Estado Civil:</label>
        <input type="text" id="estado_civil" placeholder="solteiro(a)">
    </div>
    <div class="campo">
        <label>Profissão:</label>
        <input type="text" id="profissao" placeholder="engenheiro(a)">
    </div>
    <div class="campo">
        <label>RG:</label>
        <input type="text" id="rg" placeholder="00.000.000-0">
    </div>
    <div class="campo">
        <label>CPF:</label>
        <input type="text" id="cpf" placeholder="000.000.000-00">
    </div>
    <div class="campo">
        <label>Endereço Completo:</label>
        <input type="text" id="endereco" placeholder="Rua Exemplo, 123, Centro, Ribeirão Preto/SP, CEP:">
    </div>
    <div class="campo">
        <label>Valor da proposta de acordo:</label>
        <input type="text" id="valor_acordo" placeholder="R$ 5.000,00">
    </div>
    <div class="campo">
        <label>Padawan autor da arte:</label>
        <input type="text" id="nome_bad_boy" placeholder="Nome do estagiário(a)" oninput="atualizarBotao()">
    </div>

    <button type="button" id="btnGerar" onclick="gerarDocumentos()">Forjar Petições</button>
</div>

<div id="idle-toast" class="idle-toast" onclick="limparTimerCafe()">
    ☕ Muita calma nessa Força... Precisa de ajuda ou um café, padawan? 
</div>

<script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.37.11/build/docxtemplater.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<script>
// --- URL DA SUA API GOOGLE SHEETS ---
const URL_PLANILHA_JEDI = "https://script.google.com/macros/s/AKfycbzvfsh-NOIrdvAVnTrTR7q1JurdLpnaPBjsn8NxcKy2WEWewcf11DSZDaGNz5V8-zqPpg/exec";

var audioForja = new Audio('modelos/som-jedi.mp3');

function revelarSegredo() {
    var frasesYoda = [
        "Faça ou não faça. A tentativa não existe. (Principalmente na qualificação da parte!)",
        "O medo é o caminho para o lado sombrio. E não protocolar no prazo também.",
        "Passar o que aprendeu, você deve. Ajude seu colega padawan ao lado.",
        "Um Jedi usa a Força para o conhecimento e a defesa. Nunca para bater no teclado."
    ];
    var fraseSorteada = frasesYoda[Math.floor(Math.random() * frasesYoda.length)];
    alert("🥷 HOLOCRON SECRETO DESBLOQUEADO:\n\n" + fraseSorteada);
}

var TEXTO_BOTAO_PADRAO = "Forjar Petições";
var TEXTO_NAO_PADAWAN = "não acho que você seja um padawan";
// Nomes em minúsculo para a checagem funcionar corretamente!
var PADAWANS = ["joao", "miguel", "chueng", "filipe", "philip", "bruna", "pedro", "marco", "gabriel", "fabrizio"];
var SITHS = ["diogo", "beatriz", "hugo", "heitor", "luiz"];

function normalizar(texto) {
    if (!texto) return "";
    return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function nomeEhPadawan() {
    var input = document.getElementById('nome_bad_boy');
    if (!input) return true;
    var nome = normalizar(input.value.trim());
    if (nome === "") return true;
    for (var i = 0; i < PADAWANS.length; i++) {
        if (nome.indexOf(PADAWANS[i]) !== -1) return true;
    }
    return false;
}

function atualizarBotao() {
    var input = document.getElementById('nome_bad_boy');
    var botao = document.getElementById('btnGerar');
    var varaInput = document.getElementById('vara');
    
    if (!input || !botao) return;

    var nome = normalizar(input.value.trim());
    var vara = varaInput ? varaInput.value.trim() : "";

    var ehSith = false;
    for (var i = 0; i < SITHS.length; i++) {
        if (nome.indexOf(SITHS[i]) !== -1) {
            ehSith = true;
            break;
        }
    }
    
    if (ehSith) {
        botao.classList.add('sith-mode');
    } else {
        botao.classList.remove('sith-mode');
    }
    
    if (nomeEhPadawan()) {
        botao.innerText = TEXTO_BOTAO_PADRAO;
        if (vara !== "66") {
            document.body.classList.remove('dark-mode');
        }
    } else {
        botao.innerText = TEXTO_NAO_PADAWAN;
    }
}

function verificarOrdem66() {
    var varaInput = document.getElementById('vara');
    var vara = varaInput ? varaInput.value.trim() : "";

    if (vara === "66") {
        document.body.classList.add('dark-mode');
        setTimeout(function() {
            alert("⚠️ ALERTA DO SENADO GALÁCTICO ⚠️\n\nExecutando Ordem 66...\n\nBrincadeira, padawan! Pode ir voltando ao trabalho.");
        }, 500);
    } else {
        if (nomeEhPadawan()) {
            document.body.classList.remove('dark-mode');
        }
    }
}

var timerCafe;
var TEMPO_ESPERA = 30000;

function iniciarTimerCafe() {
    clearTimeout(timerCafe);
    var toast = document.getElementById('idle-toast');
    if (toast) toast.classList.remove('show');
    
    timerCafe = setTimeout(function() {
        var toast = document.getElementById('idle-toast');
        if (toast) toast.classList.add('show');
    }, TEMPO_ESPERA);
}

function limparTimerCafe() {
    clearTimeout(timerCafe);
    var toast = document.getElementById('idle-toast');
    if (toast) toast.classList.remove('show');
}

function inicializarEasterEggCafe() {
    var campos = document.querySelectorAll('input[type="text"], select');
    campos.forEach(function(campo) {
        campo.addEventListener('focus', iniciarTimerCafe);
        campo.addEventListener('input', iniciarTimerCafe);
        campo.addEventListener('blur', limparTimerCafe);
    });
}

async function gerarDocumentos() {
    var btn = document.getElementById('btnGerar');

    if (!nomeEhPadawan()) {
        document.body.classList.add('dark-mode');
        alert("🚧 PROGRAMA EM TESTE 🚧\n\nEste é um programa em teste e está em fase de implementação. Por enquanto, a geração de documentos não está liberada para este usuário.");
        return;
    }
    
    audioForja.currentTime = 0;
    audioForja.play().catch(function(erro) {});

    btn.disabled = true;
    btn.innerText = "Acessando os Arquivos Jedi, aguarde...";

    var arquivosSelecionados = [];
    var chkHab = document.getElementById('chk_habilitacao');
    var chkCont = document.getElementById('chk_contestacao');
    var chkProc = document.getElementById('chk_procuracao');
    var chkGrat = document.getElementById('chk_gratuidade');

    if (chkHab && chkHab.checked) {
        arquivosSelecionados.push({ id: 'Habilitacao', caminho: 'modelos/habilitacao.docx' });
    }
    if (chkCont && chkCont.checked) {
        arquivosSelecionados.push({ id: 'Contestacao', caminho: 'modelos/Contestação por negativa geral - curadoria especial.docx' });
    }
    if (chkProc && chkProc.checked) {
        arquivosSelecionados.push({ id: 'Procuracao', caminho: 'modelos/procuracao.docx' });
    }
    if (chkGrat && chkGrat.checked) {
        arquivosSelecionados.push({ id: 'Gratuidade', caminho: 'modelos/gratuidade.docx' });
    }

    if (arquivosSelecionados.length === 0) {
        alert("Atenção, padawan: Selecione pelo menos um documento para gerar.");
        btn.disabled = false;
        atualizarBotao();
        return;
    }

    var getVal = function(id) {
        var el = document.getElementById(id);
        return el ? el.value : "";
    };

    var dados = {
        vara: getVal('vara'),
        competencia: getVal('competencia'),
        numero: getVal('numero'),
        nome_autor: getVal('nome_autor').toUpperCase(),
        nacionalidade: getVal('nacionalidade'),
        estado_civil: getVal('estado_civil'),
        profissao: getVal('profissao'),
        rg: getVal('rg'),
        cpf: getVal('cpf'),
        endereco: getVal('endereco'),
        valor_acordo: getVal('valor_acordo'),
        nome_bad_boy: getVal('nome_bad_boy').toUpperCase()
    };

    var nomeBase = dados.nome_autor ? dados.nome_autor.split(" ")[0] : "Cliente";
    var sucessoTotal = true;

    var DocxConstructor = window.docxtemplater || window.Docxtemplater;
    if (typeof PizZip === 'undefined' || typeof DocxConstructor === 'undefined') {
        alert("Erro ao carregar bibliotecas. Verifique a conexão com a internet.");
        btn.disabled = false;
        atualizarBotao();
        return;
    }

    for (var i = 0; i < arquivosSelecionados.length; i++) {
        var arquivo = arquivosSelecionados[i];
        try {
            var resposta = await fetch(arquivo.caminho);
            
            if (!resposta.ok) {
                throw new Error("Holocron não encontrado: O ficheiro " + arquivo.caminho + " não está acessível.");
            }
            
            var conteudoBinario = await resposta.arrayBuffer();
            var zip = new PizZip(conteudoBinario);
            
            var doc = new DocxConstructor(zip, {
                paragraphLoop: true,
                linebreaks: true,
            });

            doc.render(dados);

            var blobDocumento = doc.getZip().generate({
                type: "blob",
                mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            });
            
            saveAs(blobDocumento, arquivo.id + "_" + nomeBase + ".docx");

            await new Promise(function(resolve) { setTimeout(resolve, 500); });

        } catch (erro) {
            console.error(erro);
            alert("Ocorreu um distúrbio na Força (" + arquivo.id + "): " + erro.message);
            sucessoTotal = false;
        }
    }

    // --- REGISTRO NA PLANILHA ---
    if (sucessoTotal) {
        var nomesPecasMarcadas = arquivosSelecionados.map(function(arq) { return arq.id; }).join(", ");
        
        var dadosRegistro = {
            padawan: dados.nome_bad_boy || "Desconhecido",
            processo: dados.numero || "Não informado",
            acao: "Habilitação",
            pecas: nomesPecasMarcadas
        };

        fetch(URL_PLANILHA_JEDI, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(dadosRegistro)
        }).catch(function(err) { console.log("Erro ao salvar no holocron (planilha):", err); });

        alert("Documentos forjados com sucesso! O Conselho Jedi ainda precisa aprovar.");
    }

    btn.disabled = false;
    atualizarBotao();
}

window.revelarSegredo = revelarSegredo;
window.normalizar = normalizar;
window.nomeEhPadawan = nomeEhPadawan;
window.atualizarBotao = atualizarBotao;
window.verificarOrdem66 = verificarOrdem66;
window.gerarDocumentos = gerarDocumentos;
window.limparTimerCafe = limparTimerCafe; 

document.addEventListener('DOMContentLoaded', function() {
    atualizarBotao();
    inicializarEasterEggCafe();
});
</script>

</body>
</html>
