<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forja de Documentos - EAJ UNAERP</title>
    
    <!-- Fonte moderna do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --unaerp-blue: #4054a5;
            --unaerp-green: #8dc63f;
            --bg-color: #f4f6f9;
            --text-main: #333;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-main);
            transition: background-color 0.8s ease, color 0.8s ease;
        }
        
        /* Modo escuro (Ordem 66) */
        body.dark-mode {
            background-color: #0b0c10;
        }
        body.dark-mode .container {
            background-color: #1f2833;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: #c5c6c7;
        }
        body.dark-mode label {
            color: #c5c6c7;
        }
        body.dark-mode h2, body.dark-mode .header-text {
            color: #66fcf1;
        }
        body.dark-mode .padawan-greeting {
            background: #111;
            color: #45a29e;
            border-left-color: #45a29e;
        }
        body.dark-mode input[type="text"], body.dark-mode select {
            background-color: #0b0c10;
            color: #fff;
            border-color: #45a29e;
        }
        body.dark-mode .header-img {
            background-color: white; 
            padding: 10px;
            border-radius: 8px;
        }

        .container { 
            max-width: 750px; 
            margin: 20px auto; 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            transition: background-color 0.8s ease, color 0.8s ease;
        }
        
        /* Logo e Título do EAJ */
        .header-img {
            width: 100%;
            max-width: 250px;
            display: block;
            margin: 0 auto 15px auto;
            object-fit: contain;
            transition: background-color 0.8s ease;
        }
        .header-text {
            text-align: center;
            color: var(--unaerp-blue);
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 25px;
            border-bottom: 3px solid var(--unaerp-green);
            padding-bottom: 20px;
            transition: color 0.8s ease;
        }
        
        h2 { 
            color: var(--text-main); 
            text-align: center; 
            margin-bottom: 5px;
            font-size: 1.2em;
            font-weight: 600;
            transition: color 0.8s ease;
        }
        
        .padawan-greeting {
            text-align: center;
            background: #eef2fa;
            color: var(--unaerp-blue);
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 600;
            margin-bottom: 30px;
            border-left: 4px solid var(--unaerp-blue);
            cursor: crosshair; 
            transition: all 0.3s ease;
        }
        .padawan-greeting:hover {
            transform: scale(1.02);
        }
        
        .campo { margin-bottom: 20px; }
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: #444; 
            font-size: 0.95em;
            transition: color 0.8s ease;
        }
        input[type="text"], select { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1.5px solid #d1d5db; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            background-color: white;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, select:focus {
            border-color: var(--unaerp-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(64, 84, 165, 0.15);
        }
        
        .checkbox-group { 
            display: flex; 
            gap: 15px; 
            margin: 25px 0; 
            background: #f8f9fa; 
            padding: 20px; 
            border-radius: 8px; 
            flex-wrap: wrap; 
            justify-content: center;
            border: 1px solid #e5e7eb;
            transition: background-color 0.8s ease;
        }
        body.dark-mode .checkbox-group {
            background-color: #111;
            border-color: #45a29e;
        }
        
        .checkbox-item { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            color: var(--unaerp-blue);
            transition: color 0.8s ease;
        }
        body.dark-mode .checkbox-item {
            color: #66fcf1;
        }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--unaerp-blue);
        }
        button { 
            background: linear-gradient(135deg, var(--unaerp-blue), #2c3e80); 
            color: white; 
            border: none; 
            padding: 16px; 
            font-size: 17px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 15px; 
            font-weight: 700; 
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(64, 84, 165, 0.3);
        }
        button:disabled { 
            background: #9ca3af; 
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }
        
        button.sith-mode {
            background: linear-gradient(135deg, #e50914, #8b0000);
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.6);
        }
        button.sith-mode:hover {
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.9);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Imagem da UNAERP e Título do Escritório de Assistência Jurídica -->
    <img src="modelos/cabecalho.png" alt="Logo UNAERP" class="header-img">
    <div class="header-text">Escritório de Assistência Jurídica</div>
    
    <h2>Forja de Documentos do EAJ</h2>
    
    <!-- Saudação Personalizada -->
    <div class="padawan-greeting" ondblclick="revelarSegredo()" title="Sente alguma perturbação na Força? Dê um duplo clique.">
        Saudações, Bruna, Chueng Lee, Philip e Pedro... Petições forjar, vocês devem!<br>
        <em>Que a Força esteja com vocês, jovens padawans.</em>
    </div>
    
    <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" id="chk_habilitacao" checked> Habilitação</label>
        <label class="checkbox-item"><input type="checkbox" id="chk_procuracao" checked> Procuração</label>
        <label class="checkbox-item"><input type="checkbox" id="chk_gratuidade" checked> Gratuidade</label>
    </div>

    <div class="campo">
        <label>Vara (ex: 1ª):</label>
        <input type="text" id="vara" placeholder="1ª" onkeyup="verificarOrdem66()">
    </div>
    
    <!-- Novo campo de seleção de competência -->
    <div class="campo">
        <label>Competência / Especialidade:</label>
        <select id="competencia">
            <option value="cível">cível</option>
            <option value="de família e sucessões">de família e sucessões</option>
            <option value="da Fazenda Pública">da Fazenda Pública</option>
            <option value="DA INFÂNCIA E DA JUVENTUDE E DO IDOSO">DA INFÂNCIA E DA JUVENTUDE E DO IDOSO</option>
        </select>
    </div>

    <div class="campo">
        <label>Processo nº:</label>
        <input type="text" id="numero" placeholder="0000000-00.0000.0.00.0000">
    </div>
    <div class="campo">
        <label>Nome Completo do Assistido:</label>
        <input type="text" id="nome_autor" placeholder="João da Silva">
    </div>
    <div class="campo">
        <label>Nacionalidade:</label>
        <input type="text" id="nacionalidade" value="brasileiro(a)">
    </div>
    <div class="campo">
        <label>Estado Civil:</label>
        <input type="text" id="estado_civil" placeholder="solteiro(a)">
    </div>
    <div class="campo">
        <label>Profissão:</label>
        <input type="text" id="profissao" placeholder="engenheiro(a)">
    </div>
    <div class="campo">
        <label>RG:</label>
        <input type="text" id="rg" placeholder="00.000.000-0">
    </div>
    <div class="campo">
        <label>CPF:</label>
        <input type="text" id="cpf" placeholder="000.000.000-00">
    </div>
    <div class="campo">
        <label>Endereço Completo:</label>
        <input type="text" id="endereco" placeholder="Rua Exemplo, 123, Centro, Ribeirão Preto/SP, CEP:">
    </div>
    <div class="campo">
        <label>Valor da proposta de acordo:</label>
        <input type="text" id="valor_acordo" placeholder="R$ 5.000,00">
    </div>
    <div class="campo">
        <label>Padawan autor da arte:</label>
        <input type="text" id="nome_bad_boy" placeholder="Nome do estagiário(a)" oninput="atualizarBotao()">
    </div>

    <button type="button" id="btnGerar" onclick="gerarDocumentos()">Forjar Petições</button>
</div>

<!-- Bibliotecas -->
<script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.37.11/build/docxtemplater.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<script>
// EASTER EGG 1: O Holocron do Mestre Yoda
function revelarSegredo() {
    const frasesYoda = [
        "Faça ou não faça. A tentativa não existe. (Principalmente na qualificação da parte!)",
        "O medo é o caminho para o lado sombrio. E não protocolar no prazo também.",
        "Passar o que aprendeu, você deve. Ajude seu colega padawan ao lado.",
        "Um Jedi usa a Força para o conhecimento e a defesa. Nunca para bater no teclado."
    ];
    
    const fraseSorteada = frasesYoda[Math.floor(Math.random() * frasesYoda.length)];
    alert("🥷 HOLOCRON SECRETO DESBLOQUEADO:\n\n" + fraseSorteada);
}

// EASTER EGG 2: Teste do Padawan + Lado Sombrio
const TEXTO_BOTAO_PADRAO = "Forjar Petições";
const TEXTO_NAO_PADAWAN = "não acho que você seja um padawan";

const PADAWANS = ["joao", "miguel", "chueng", "filipe", "philip", "bruna", "pedro"];
const SITHS = ["darth vader", "vader", "palpatine", "kylo ren", "dooku", "maul"];

function normalizar(texto) {
    return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function nomeEhPadawan() {
    const nome = normalizar(document.getElementById('nome_bad_boy').value.trim());
    return nome === "" || PADAWANS.some(padawan => nome.includes(padawan));
}

function atualizarBotao() {
    const nome = normalizar(document.getElementById('nome_bad_boy').value.trim());
    const botao = document.getElementById('btnGerar');

    botao.classList.toggle('sith-mode', SITHS.some(sith => nome.includes(sith)));
    botao.innerText = nomeEhPadawan() ? TEXTO_BOTAO_PADRAO : TEXTO_NAO_PADAWAN;
}

atualizarBotao();

// EASTER EGG 3: A Ordem 66
function verificarOrdem66() {
    const vara = document.getElementById('vara').value.trim();
    if (vara === "66") {
        document.body.classList.add('dark-mode');
        setTimeout(() => {
            alert("⚠️ ALERTA DO SENADO GALÁCTICO ⚠️\n\nExecutando Ordem 66...\n\nBrincadeira, padawan! Pode ir voltando ao trabalho.");
        }, 500);
    } else {
        document.body.classList.remove('dark-mode');
    }
}

// GERAÇÃO DE DOCUMENTOS (Habilitação, Procuração, Gratuidade)
async function gerarDocumentos() {
    const btn = document.getElementById('btnGerar');

    if (!nomeEhPadawan()) {
        alert("🚧 PROGRAMA EM TESTE 🚧\n\nEste é um programa em teste e está em fase de implementação. Por enquanto, a geração de documentos não está liberada para este usuário.");
        return;
    }
    
    btn.disabled = true;
    btn.innerText = "Acessando os Arquivos Jedi, aguarde...";

    const arquivosSelecionados = [];
    if (document.getElementById('chk_habilitacao').checked) {
        arquivosSelecionados.push({ id: 'Habilitacao', caminho: 'modelos/habilitacao.docx' });
    }
    if (document.getElementById('chk_procuracao').checked) {
        arquivosSelecionados.push({ id: 'Procuracao', caminho: 'modelos/procuracao.docx' });
    }
    if (document.getElementById('chk_gratuidade').checked) {
        arquivosSelecionados.push({ id: 'Gratuidade', caminho: 'modelos/gratuidade.docx' });
    }

    if (arquivosSelecionados.length === 0) {
        alert("Atenção, padawan: Selecione pelo menos um documento para gerar.");
        btn.disabled = false;
        atualizarBotao();
        return;
    }

    const dados = {
        vara: document.getElementById('vara').value,
        competencia: document.getElementById('competencia').value,
        numero: document.getElementById('numero').value,
        nome_autor: (document.getElementById('nome_autor').value || "").toUpperCase(),
        nacionalidade: document.getElementById('nacionalidade').value,
        estado_civil: document.getElementById('estado_civil').value,
        profissao: document.getElementById('profissao').value,
        rg: document.getElementById('rg').value,
        cpf: document.getElementById('cpf').value,
        endereco: document.getElementById('endereco').value,
        valor_acordo: document.getElementById('valor_acordo').value,
        nome_bad_boy: (document.getElementById('nome_bad_boy').value || "").toUpperCase()
    };

    const nomeBase = dados.nome_autor ? dados.nome_autor.split(" ")[0] : "Cliente";
    let sucessoTotal = true;

    for (const arquivo of arquivosSelecionados) {
        try {
            const resposta = await fetch(arquivo.caminho);
            
            if (!resposta.ok) {
                throw new Error(`Holocron não encontrado: O ficheiro ${arquivo.caminho} não está no GitHub.`);
            }
            
            const conteudoBinario = await resposta.arrayBuffer();
            const zip = new PizZip(conteudoBinario);
            
            const doc = new window.docxtemplater(zip, {
                paragraphLoop: true,
                linebreaks: true,
            });

            doc.render(dados);

            const blobDocumento = doc.getZip().generate({
                type: "blob",
                mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            });
            
            saveAs(blobDocumento, `${arquivo.id}_${nomeBase}.docx`);

            await new Promise(resolve => setTimeout(resolve, 500));

        } catch (erro) {
            console.error(erro);
            alert(`Ocorreu um distúrbio na Força (${arquivo.id}): ${erro.message}`);
            sucessoTotal = false;
        }
    }

    if (sucessoTotal) {
        alert("Documentos forjados com sucesso! O Conselho Jedi ainda precisa aprovar.");
    }

    btn.disabled = false;
    atualizarBotao();
}
</script>

</body>
</html>
